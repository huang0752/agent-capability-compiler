schema_version: '1'
id: crm.find_overdue_followups
title: Find overdue followups
kind: http
input_schema:
  type: object
  additionalProperties: false
  required:
  - as_of
  properties:
    as_of:
      type: string
      format: date
    tenant_id:
      type: string
      minLength: 1
output_schema:
  type: array
  maxItems: 100
  items:
    type: object
    additionalProperties: false
    required:
    - id
    - tenant_id
    - customer_id
    - summary
    - due_date
    - status
    properties:
      id:
        type: string
      tenant_id:
        type: string
      customer_id:
        type: string
      summary:
        type: string
      due_date:
        type: string
        format: date
      status:
        enum:
        - open
        - completed
http:
  method: GET
  path: /followups/overdue
  path_parameters: {}
  query_parameters:
    as_of: as_of
    tenant_id: tenant_id
  scopes:
  - followup.read
  timeout_seconds: 5
  max_response_bytes: 32768
safety:
  effect: read
