schema_version: '1'
id: crm.list_customer_contacts
title: List customer contacts
kind: http
input_schema:
  type: object
  additionalProperties: false
  required:
  - customer_id
  properties:
    customer_id:
      type: string
      minLength: 1
    tenant_id:
      type: string
      minLength: 1
output_schema:
  type: array
  maxItems: 100
  items:
    type: object
    additionalProperties: false
    required:
    - id
    - tenant_id
    - customer_id
    - name
    - email
    - role
    properties:
      id:
        type: string
      tenant_id:
        type: string
      customer_id:
        type: string
      name:
        type: string
      email:
        type: string
      role:
        type: string
http:
  method: GET
  path: /customers/{customer_id}/contacts
  path_parameters:
    customer_id: customer_id
  query_parameters:
    tenant_id: tenant_id
  credential_ref: CRM_DEMO_TOKEN
  scopes:
  - contact.read
  timeout_seconds: 5
  max_response_bytes: 32768
safety:
  effect: read
