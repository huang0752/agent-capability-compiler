schema_version: '2'
id: crm.list_customer_followups
title: List customer followups
kind: read
input_schema:
  type: object
  additionalProperties: false
  required:
  - customer_id
  properties:
    customer_id:
      type: string
      minLength: 1
    tenant_id:
      type: string
      minLength: 1
output_schema:
  type: array
  maxItems: 100
  items:
    type: object
    additionalProperties: false
    required:
    - id
    - tenant_id
    - customer_id
    - summary
    - due_date
    - status
    properties:
      id:
        type: string
      tenant_id:
        type: string
      customer_id:
        type: string
      summary:
        type: string
      due_date:
        type: string
        format: date
      status:
        enum:
        - open
        - completed
http:
  method: GET
  path: /customers/{customer_id}/followups
  path_parameters:
    customer_id: customer_id
  query_parameters:
    tenant_id: tenant_id
  scopes:
  - followup.read
  timeout_seconds: 5
  max_response_bytes: 32768
  request: null
  success: {statuses: [200], body: json}
  safety:
    effect: read
    risk: low
    reversibility: reversible
    retry: {mode: idempotent_only}
    idempotency: {mode: unsupported}
    concurrency: {mode: not_supported}
context_bindings: {tenant_id: tenant_context.tenant_id}
