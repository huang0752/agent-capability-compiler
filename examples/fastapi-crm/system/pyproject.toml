[project]
name = "fastapi-crm-system"
version = "0.1.0"
description = "Synthetic read-only CRM used as an independent ACC example source system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<0.141",
    "pydantic>=2.13,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.20,<2",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.16,<1",
]

[build-system]
requires = ["hatchling>=1.29"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_crm_system"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "strict"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
files = ["src", "tests"]
