# Planning artifact: every capability remains blocked until its operations and policy have evidence.
schema_version: "2"
goal: REPLACE_WITH_USER_OUTCOME

capabilities:
  - id: REPLACE_WITH_CAPABILITY_ID
    title: REPLACE_WITH_CAPABILITY_TITLE
    business_outcome: REPLACE_WITH_BUSINESS_OUTCOME
    operation_dependencies:
      - REPLACE_WITH_OPERATION_ID
    composition_reason: REPLACE_WITH_REASON_THIS_IS_NOT_ONE_INTERFACE_ONE_TOOL
    agent_inputs:
      - resource_id
    runtime_only_inputs:
      - base_url_ref
      - provider_auth
    quality:
      selector_acquisition:
        resource_id:
          kind: resource_selector
          acquisition: caller
          resource_type: REPLACE_WITH_RESOURCE_TYPE
          producers: []
      empty_success_path: not_applicable
      failure_isolation: fail_fast
      output_budget:
        max_bytes: 65536
        long_text_disclosures: []
    policy: REPLACE_WITH_POLICY_ID
    evals:
      positive: replace_capability_positive
      # Required only for scoped/tenant-protected capabilities; otherwise leave null.
      permission_negative: null
      # For singular APIs where 404 is absence, use not_applicable and add a not-found Eval.
      empty: not_applicable
    status: blocked_on_evidence

coverage:
  scope_mode: system_complete
  scope_inventory: scope-inventory.yaml
  route_dispositions:
    planned:
      - REPLACE_WITH_SCOPE_ROUTE_ID
    composed: []
    excluded: []
    blocked_on_evidence: []
    out_of_scope: []
  # Exact JSON Pointers only: /routes/{index}/exclusion_decision. This list
  # covers every system-complete eligible excluded decision. The authoritative
  # rationale, evidence, approval, replacements, and capability IDs remain in
  # Scope Inventory; never add a free-text deliberately_excluded section here.
  exclusion_decision_refs: []
  high_value_operations:
    - REPLACE_WITH_OPERATION_ID

risks:
  - risk: REPLACE_WITH_PERMISSION_OR_DISCLOSURE_RISK
    mitigation: REPLACE_WITH_POLICY_OR_EVAL_MITIGATION

open_questions:
  - REPLACE_WITH_QUESTION_THAT_MUST_BE_RESOLVED_BEFORE_IMPLEMENTATION
