# Planning artifact: discovered source routes and their explicit scope dispositions.
schema_version: "1"
scope:
  mode: system_readonly_complete
  user_confirmation: null
  selected_domains: []
  exclusion_approval:
    approved_route_ids: []
    approval_text: null
discovery:
  source_commit: "git:0123456789abcdef"
  methods: [GET, HEAD]
  include_paths: [backend/app/api]
  evidence_sources: [api-router]
domains:
  - id: REPLACE_WITH_DOMAIN_ID
    status: selected
exclusion_rules: []
# For every eligible excluded route, add exactly one rule with:
# id, category, route_ids, rationale, and evidence_sources. The route must
# reference it through exclusion_rule_id and carry its own exclusion_decision.
# A valid structured system-complete exclusion leaves legacy reason null.
# Ineligible, blocked, out-of-scope, pilot/domain legacy exclusions still need reason.
routes:
  - id: REPLACE_WITH_SCOPE_ROUTE_ID
    # Keep the established `domain` key; do not rename it to `domain_id`.
    domain: REPLACE_WITH_DOMAIN_ID
    method: GET
    path: /REPLACE_WITH_EVIDENCED_RESOURCE
    evidence_sources: [REPLACE_WITH_ROUTE_EVIDENCE_SOURCE]
    usage_evidence_sources: [REPLACE_WITH_NORMALIZED_USAGE_EVIDENCE_SOURCE]
    eligibility: eligible
    disposition: planned
    operation_id: REPLACE_WITH_OPERATION_ID
    capability_ids: [REPLACE_WITH_CAPABILITY_ID]
    reason: null
    exclusion_rule_id: null
    exclusion_decision: null
summary:
  discovered_routes: 1
  eligible_read_routes: 1
  planned: 1
  composed: 0
  excluded: 0
  blocked_on_evidence: 0
  out_of_scope: 0
  unresolved: 0
