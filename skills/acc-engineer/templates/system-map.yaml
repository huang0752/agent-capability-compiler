    kind: source_file
    location: REPLACE_WITH_SOURCE_RELATIVE_PATH

domains:
  - id: REPLACE_WITH_DOMAIN_ID
    purpose: REPLACE_WITH_EVIDENCED_DOMAIN_PURPOSE

entities:
  - id: REPLACE_WITH_ENTITY_ID
    domain: REPLACE_WITH_DOMAIN_ID
    evidence_sources:
      - REPLACE_WITH_EVIDENCE_SOURCE_ID

candidate_operations:
