relationships:
  - from: REPLACE_WITH_SOURCE_ENTITY_ID
    to: REPLACE_WITH_TARGET_ENTITY_ID
    evidence_sources:
      - REPLACE_WITH_EVIDENCE_SOURCE_ID

existing_tests:
  - path: REPLACE_WITH_EXISTING_TEST_PATH
    covers:
      - REPLACE_WITH_OPERATION_ID

unconfirmed:
