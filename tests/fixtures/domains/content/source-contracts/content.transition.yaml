schema_version: '2'
id: content.transition.contract
operation_id: content.transition
request_schema:
  type: object
  additionalProperties: false
  properties:
    entity_id:
      type: string
      maxLength: 128
    target_state:
      type: string
      maxLength: 128
  required:
  - entity_id
  - target_state
response_schema:
