schema_version: '2'
id: content.transition
title: Transition content
kind: action
input_schema:
  type: object
  additionalProperties: false
  properties:
    entity_id:
      type: string
      maxLength: 128
    target_state:
      type: string
      maxLength: 128
  required:
  - entity_id
  - target_state
output_schema:
  type: object
  additionalProperties: false
  properties:
    entity_id:
      type: string
      maxLength: 128
    status:
      type: string
      maxLength: 128
  required:
  - entity_id
  - status
http:
  method: PATCH
  path: /content/{entity_id}/transition
  path_parameters:
    entity_id: entity_id
  query_parameters: {}
  request:
    kind: json
    body_parameters:
      /target_state: target_state
    max_request_bytes: 4096
  success:
    statuses:
    - 200
    body: json
  scopes:
  - content.write
  timeout_seconds: 10
  max_response_bytes: 16384
  safety:
    effect: transition
    risk: medium
    reversibility: reversible
    retry:
      mode: never
    idempotency:
      mode: state_idempotent
      state_pointer: /status
      terminal_values:
      - published
    concurrency:
      mode: server_serialized_state_predicate
      read_operation_id: content.status
      state_pointer: /status
      allowed_values:
      - draft
      - reviewed
context_bindings: {}
evidence:
- source_id: content-source-contract
  kind: content
  locator: embedded-artifact:content-source-contract
  summary: Source routes, request schemas, response schemas, and action semantics
    were inspected.
