schema_version: '2'
id: finance.transition
title: Transition finance
kind: action
input_schema:
  type: object
  additionalProperties: false
  properties:
    entity_id:
      type: string
      maxLength: 128
    target_state:
      type: string
      maxLength: 128
  required:
  - entity_id
  - target_state
output_schema:
  type: object
  additionalProperties: false
  properties:
    entity_id:
      type: string
      maxLength: 128
    status:
      type: string
      maxLength: 128
  required:
  - entity_id
  - status
http:
  method: PATCH
  path: /finance/{entity_id}/transition
  path_parameters:
    entity_id: entity_id
  query_parameters: {}
  request:
    kind: json
    body_parameters:
      /target_state: target_state
    max_request_bytes: 4096
  success:
    statuses:
    - 200
    body: json
  scopes:
  - finance.write
  timeout_seconds: 10
  max_response_bytes: 16384
  safety:
    effect: transition
    risk: high
    reversibility: reversible
    retry:
      mode: idempotent_only
    idempotency:
      mode: source_key
      target:
        kind: header
        name: Idempotency-Key
    concurrency:
      mode: required
      token:
        kind: response_header
        name: ETag
      precondition:
        kind: header
        name: If-Match
