[project]
name = "acc-runtime"
version = "0.1.0"
description = "Generic, deterministic MCP runtime for ACC capability packs"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "acc-core==0.1.0",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "mcp>=1.12,<2",
    "pydantic>=2.10,<3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acc_runtime"]
