[project]
name = "acc-core"
version = "0.1.0"
description = "Deterministic models, validation, compilation, evaluation, and packaging for ACC"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "jsonschema>=4.23,<5",
    "pydantic>=2.10,<3",
    "PyYAML>=6.0.2,<7",
]

[project.scripts]
acc = "acc_core.cli.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acc_core"]
