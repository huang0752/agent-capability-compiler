[project]
name = "acc-adapter-sdk"
version = "0.1.0"
description = "Contracts and server primitives for out-of-process ACC adapters"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "uvicorn>=0.34,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acc_adapter_sdk"]
