[project]
name = "acc-testkit"
version = "0.1.0"
description = "Reusable fake systems, clients, assertions, and fault injection for ACC tests"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "acc-adapter-sdk==0.1.0",
    "acc-runtime==0.1.0",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "mcp>=1.12,<2",
    "pydantic>=2.10,<3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acc_testkit"]
